<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0605" />
    <meta name="color-scheme" content="dark" />
    <!-- Per-page title, description, canonical, Open Graph and JSON-LD are
         written here at build time by scripts/prerender.mjs (from src/seo.ts) -->
    <!--app-head-->
    <script>
      // Hide hero / page titles until their entrance animation runs (see motion.css).
      // Failsafe: reveal after 4s even if the bundle never loads.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var root = document.documentElement
        root.classList.add('js-motion')
        setTimeout(function () { root.classList.remove('js-motion') }, 4000)
      }
    </script>

    <!-- Favicons -->
    <!-- Profile portrait at each size, generated by `npm run brand-assets` (scripts/make-brand-assets.mjs) -->
    <link rel="icon" href="/images/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/images/brand/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#fff4ee;background:#0b0605">
        Marco Schoeman: founder, operator and builder. Message @marco_founder on Instagram or TikTok, or email marcoschoeman1988@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
