name: Redirect GitHub Pages to marcoschoeman.com

# The site itself is built and hosted by Cloudflare Pages (see README.md).
# This workflow only publishes github-pages-redirect/ to
# marco-schoeman-dev.github.io, so old links land on marcoschoeman.com.
# Merge this to main only AFTER marcoschoeman.com is live on Cloudflare.

on:
  push:
    branches: [main]
    paths:
      - github-pages-redirect/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
